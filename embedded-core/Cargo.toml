[package]
name = "embedded-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
heapless = "0.8"
defmt = "0.3.10"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-graphics = "0.8.2"
embedded-graphics-core = "0.4.1"

[dev-dependencies]
embedded-graphics-simulator = "0.8.0"
embedded-hal-mock = { version = "0.11.1", features = [
    "eh1",
    "embedded-hal-async",
] }
tokio = { version = "1", features = ["full"] }
