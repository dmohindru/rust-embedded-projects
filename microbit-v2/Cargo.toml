[workspace]
members = ["projects/project00_hello_world", "projects/led_matrix_projects/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.83"

[workspace.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "0.3.10"
defmt-rtt = "0.4.1"
embassy-executor = { version = "0.7.0", features = [
    "arch-cortex-m",
    "defmt",
    "executor-thread",
] }
embassy-nrf = { version = "0.3.1", features = [
    "defmt",
    "gpiote",
    "nrf52833",
    "time",
    "time-driver-rtc1",
] }
embassy-time = { version = "0.4.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-sync = "0.5.0"
heapless = "0.8"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }
# async-trait is always available on no_std, but we must disable default std
async-trait = { version = "0.1", default-features = false }
embedded-alloc = "0.5"


[profile.release]
debug = 2
